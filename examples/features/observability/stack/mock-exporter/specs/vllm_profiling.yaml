# ms_service_metric (vllm_profiling) 指标
# ------------------------------------------------------------------
# 1:1 复刻 Ascend/msserviceprofiler -> ms_service_metric 在 vLLM 上
# 通过 hook 暴露的 profiling 指标。
#
# 关键约定（与 ms_service_metric 实现保持一致）：
#   * 指标名前缀固定为 "vllm_profiling_"
#     (ms_service_metric.adapters.vllm.metrics_init.VLLM_METRICS_PREFIX)
#   * 名称中的冒号 ":" 被保留（依赖 prometheus utf8-names）。
#   * MetricsManager 为所有指标自动追加 3 个标签：dp / role / phase。
#     - dp    : data-parallel rank
#     - role  : 实例 PD 角色（prefill / decode / mixed）
#     - phase : 当前 batch 阶段（prefill / decode / mixed）
#   * ms_service_metric 的 timer 类型在底层就是 Histogram（带
#     _bucket/_count/_sum），因此本 mock 中统一用 type: histogram 复刻，
#     二者暴露形态完全一致（Dashboard 用 histogram_quantile 计算分位数）。
#   * counter 类型由 prometheus_client 追加 "_total" 后缀。
#
# 这些指标在真实环境中由被 hook 的 vLLM 引擎进程 /metrics 暴露
# (motor-engine-prefill / motor-engine-decode job)，此处用 mock 数据
# 按相同 schema 复刻，使 Dashboard 在真假数据间零修改切换。

# 共享锚点：减少重复 ------------------------------------------------
_anchors:
  # 阶段时延类（duration / timer -> histogram）通用标签
  phase_labels: &phase_labels [dp, role, phase]
  phase_label_values: &phase_label_values
    dp: ["0"]
    role: [prefill, decode]
    phase: [prefill, decode, mixed]
  # 时延直方图分桶：覆盖 1ms~300s，足够 histogram_quantile 计算分位数
  duration_buckets: &duration_buckets
    [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0]
  # 尺寸类直方图分桶（batch_size / queue / token 数）
  size_buckets: &size_buckets
    [1, 5, 10, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000]

metrics:
  # =================================================================
  # 1) Engine Core 主循环阶段时延（profiling 核心拆解）
  # =================================================================
  - name: "vllm_profiling_engine_core:engine_core_step:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.3, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_engine_core:process_engine_step:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.4, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_engine_core:process_input_queue:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.0, sigma: 0.6, rate_per_sec: 8.0 }

  # =================================================================
  # 2) Scheduler 阶段时延
  # =================================================================
  - name: "vllm_profiling_scheduler:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -5.0, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_scheduler:update_from_output:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.5, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_scheduler:add_request:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -5.5, sigma: 0.6, rate_per_sec: 0.5 }

  # =================================================================
  # 3) Executor / ModelRunner / Worker 阶段时延（NPU 算子相关）
  # =================================================================
  - name: "vllm_profiling_executor:execute_model:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.5, sigma: 0.4, rate_per_sec: 8.0 }

  - name: "vllm_profiling_executor:model_runner_execute_model:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.6, sigma: 0.4, rate_per_sec: 8.0 }

  - name: "vllm_profiling_executor:prepare_inputs:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.2, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_executor:sample_tokens:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.0, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_worker:model_runner_get_output:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.3, sigma: 0.5, rate_per_sec: 8.0 }

  # ---- NPU 计算时间线拆解（forward / kernel launch / non-forward）----
  - name: "vllm_profiling_npu:forward_duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.7, sigma: 0.4, rate_per_sec: 8.0 }

  - name: "vllm_profiling_npu:kernel_launch"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -3.8, sigma: 0.4, rate_per_sec: 8.0 }

  - name: "vllm_profiling_npu:non_forward_duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.5, sigma: 0.5, rate_per_sec: 8.0 }

  # ---- 细粒度算子计时 record_function_or_nullcontext（按算子名拆分）----
  - name: "vllm_profiling_record_function_or_nullcontext"
    type: histogram
    labels: [name, dp, role, phase]
    label_values:
      name: ["prepare input", "forward", "post process", "sample_token", "draft_token"]
      dp: ["0"]
      role: [decode]
      phase: [prefill, decode]
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -3.5, sigma: 0.6, rate_per_sec: 8.0 }

  # =================================================================
  # 4) 请求处理链路时延（API / engine / tokenizer / output）
  # =================================================================
  - name: "vllm_profiling_server:create_chat_completion:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: 0.7, sigma: 0.5, rate_per_sec: 0.5 }

  - name: "vllm_profiling_engine:generate:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: 0.6, sigma: 0.5, rate_per_sec: 0.5 }

  - name: "vllm_profiling_engine:async_add_request:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -5.0, sigma: 0.6, rate_per_sec: 0.5 }

  - name: "vllm_profiling_engine:tokenizer_encode"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.5, sigma: 0.6, rate_per_sec: 0.5 }

  - name: "vllm_profiling_output_processor_duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -4.0, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_async_llm:record_stats:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -5.0, sigma: 0.5, rate_per_sec: 8.0 }

  - name: "vllm_profiling_async_llm:abort_requests:duration"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -5.0, sigma: 0.6, rate_per_sec: 0.05 }

  - name: "vllm_profiling_engine_core_outputs_len"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *size_buckets
    value: { mode: histogram_lognormal, mu: 3.0, sigma: 1.0, rate_per_sec: 8.0 }

  # =================================================================
  # 5) Scheduler 批次 / 队列 / 序列长度
  # =================================================================
  - name: "vllm_profiling_scheduler:batch_size"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *size_buckets
    value: { mode: histogram_lognormal, mu: 3.0, sigma: 0.8, rate_per_sec: 8.0 }

  - name: "vllm_profiling_scheduler:running_queue_size"
    type: histogram
    labels: *phase_labels
    label_values: *phase_label_values
    buckets: *size_buckets
    value: { mode: histogram_lognormal, mu: 3.2, sigma: 0.8, rate_per_sec: 8.0 }

  - name: "vllm_profiling_scheduler:seqlen:avg"
    type: gauge
    labels: *phase_labels
    label_values: *phase_label_values
    value: { mode: gauge_sin, base: 512.0, amp: 200.0, period_sec: 180, noise: 20.0, clamp: [1, 32768] }

  - name: "vllm_profiling_scheduler:seqlen:sum"
    type: gauge
    labels: *phase_labels
    label_values: *phase_label_values
    value: { mode: gauge_sin, base: 8192.0, amp: 3000.0, period_sec: 180, noise: 200.0, clamp: [1, 1048576] }

  - name: "vllm_profiling_scheduler:phase_batch_size"
    type: histogram
    labels: [req_phase, dp, role, phase]
    label_values:
      req_phase: [prefill, decode]
      dp: ["0"]
      role: [prefill, decode]
      phase: [prefill, decode]
    buckets: *size_buckets
    value: { mode: histogram_lognormal, mu: 2.8, sigma: 0.8, rate_per_sec: 8.0 }

  - name: "vllm_profiling_scheduler:phase_scheduled_tokens"
    type: histogram
    labels: [req_phase, dp, role, phase]
    label_values:
      req_phase: [prefill, decode]
      dp: ["0"]
      role: [prefill, decode]
      phase: [prefill, decode]
    buckets: *size_buckets
    value: { mode: histogram_lognormal, mu: 4.0, sigma: 1.0, rate_per_sec: 8.0 }

  # =================================================================
  # 6) 计数器（counter -> 自动追加 _total）
  # =================================================================
  - name: "vllm_profiling_scheduler:recompute_events"
    type: counter
    labels: *phase_labels
    label_values: *phase_label_values
    value: { mode: counter_rate, rate_per_sec: 0.02 }

  - name: "vllm_profiling_scheduler:phase_scheduled_token_counter"
    type: counter
    labels: [req_phase, dp, role, phase]
    label_values:
      req_phase: [prefill, decode]
      dp: ["0"]
      role: [prefill, decode]
      phase: [prefill, decode]
    value: { mode: counter_rate, rate_per_sec: 64.0 }

  - name: "vllm_profiling_running_to_waiting_count"
    type: counter
    labels: *phase_labels
    label_values: *phase_label_values
    value: { mode: counter_rate, rate_per_sec: 0.02 }

  - name: "vllm_profiling_block_allocate_failures"
    type: counter
    labels: *phase_labels
    label_values: *phase_label_values
    value: { mode: counter_rate, rate_per_sec: 0.01 }

  - name: "vllm_profiling_rpc_errors"
    type: counter
    labels: [exception_type, dp, role, phase]
    label_values:
      exception_type: [TimeoutError, RuntimeError]
      dp: ["0"]
      role: [prefill, decode]
      phase: [mixed]
    value: { mode: counter_rate, rate_per_sec: 0.005 }

  # =================================================================
  # 7) 静态显存指标（engine:memory:* — PR!360 新增，类型 Gauge）
  #    一次性在 worker 初始化后采集，因此 phase=mixed。
  # =================================================================
  - name: "vllm_profiling_engine:memory:total_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 64.0 }

  - name: "vllm_profiling_engine:memory:utilization_ratio"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 0.9 }

  - name: "vllm_profiling_engine:memory:reserved_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 57.6 }

  - name: "vllm_profiling_engine:memory:weights_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 30.0 }

  - name: "vllm_profiling_engine:memory:kvcache_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 20.0 }

  - name: "vllm_profiling_engine:memory:non_torch_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 2.5 }

  - name: "vllm_profiling_engine:memory:activation_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 3.0 }

  - name: "vllm_profiling_engine:memory:graph_gb"
    type: gauge
    labels: [dp, role, phase]
    label_values: { dp: ["0"], role: [prefill, decode], phase: [mixed] }
    value: { mode: constant, value: 1.5 }

  # =================================================================
  # 8) EPLB 专家热度 / 负载均衡（MoE / EP 场景，如 DeepSeek-V3）
  # =================================================================
  - name: "vllm_profiling_eplb:expert_hotness:current_mean"
    type: gauge
    labels: [rank, dp, role, phase]
    label_values: { rank: ["0"], dp: ["0"], role: [decode], phase: [decode] }
    value: { mode: gauge_sin, base: 1024.0, amp: 200.0, period_sec: 120, noise: 30.0, clamp: [0, 100000] }

  - name: "vllm_profiling_eplb:expert_hotness:current_max"
    type: gauge
    labels: [rank, dp, role, phase]
    label_values: { rank: ["0"], dp: ["0"], role: [decode], phase: [decode] }
    value: { mode: gauge_sin, base: 2048.0, amp: 400.0, period_sec: 120, noise: 60.0, clamp: [0, 200000] }

  - name: "vllm_profiling_eplb:expert_hotness:update_mean"
    type: gauge
    labels: [rank, dp, role, phase]
    label_values: { rank: ["0"], dp: ["0"], role: [decode], phase: [decode] }
    value: { mode: gauge_sin, base: 1000.0, amp: 180.0, period_sec: 120, noise: 30.0, clamp: [0, 100000] }

  - name: "vllm_profiling_eplb:expert_hotness:update_max"
    type: gauge
    labels: [rank, dp, role, phase]
    label_values: { rank: ["0"], dp: ["0"], role: [decode], phase: [decode] }
    value: { mode: gauge_sin, base: 2000.0, amp: 360.0, period_sec: 120, noise: 60.0, clamp: [0, 200000] }

  - name: "vllm_profiling_eplb:expert_hotness:imbalance"
    type: gauge
    labels: [rank, phase, layer, dp, role]
    label_values:
      rank: ["0"]
      phase: [current, update]
      layer: ["0", "1", "2", "3"]
      dp: ["0"]
      role: [decode]
    value: { mode: gauge_sin, base: 1.3, amp: 0.25, period_sec: 90, noise: 0.05, clamp: [1, 8] }

  # ---- EPLB 调整动作时延 ----
  - name: "vllm_profiling_eplb:expert_weight_update:duration"
    type: histogram
    labels: *phase_labels
    label_values: { dp: ["0"], role: [decode], phase: [decode] }
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -1.0, sigma: 0.5, rate_per_sec: 0.1 }

  - name: "vllm_profiling_eplb:expert_map_update:duration"
    type: histogram
    labels: *phase_labels
    label_values: { dp: ["0"], role: [decode], phase: [decode] }
    buckets: *duration_buckets
    value: { mode: histogram_lognormal, mu: -2.0, sigma: 0.5, rate_per_sec: 0.1 }
