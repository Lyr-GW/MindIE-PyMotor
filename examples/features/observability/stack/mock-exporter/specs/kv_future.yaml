# KV Cache 分层管理指标（pymotor 当前未实现，对标 NVIDIA Dynamo kvbm_*）
# 待 KV Pool / Conductor / Mooncake 暴露指标后直接复用同名同标签 schema
metrics:
  - name: motor_kv_cache_hit_rate
    type: gauge
    help: KV cache hit rate (0.0-1.0).
    labels: [instance_id, pd_role]
    value:
      mode: gauge_sin
      base: 0.55
      amp: 0.25
      period_sec: 240
      noise: 0.05
      clamp: [0.0, 1.0]

  - name: motor_kv_offload_blocks_total
    type: counter
    help: Number of KV blocks offloaded.
    labels: [instance_id, direction]
    label_values:
      direction: [d2h, h2d, d2d]
    value:
      mode: counter_rate_per_label
      direction:
        d2h: 5.0
        h2d: 1.0
        d2d: 0.5

  - name: motor_kv_onboard_blocks_total
    type: counter
    help: Number of KV blocks onboarded.
    labels: [instance_id, direction]
    label_values:
      direction: [h2d, d2d]
    value:
      mode: counter_rate_per_label
      direction:
        h2d: 4.0
        d2d: 0.4

  - name: motor_kv_matched_tokens_total
    type: counter
    help: Number of matched (prefix cache) tokens.
    labels: [instance_id]
    value:
      mode: counter_rate
      rate_per_sec: 40.0
