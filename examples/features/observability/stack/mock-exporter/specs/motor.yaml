# Motor coordinator native metrics
# 1:1 复刻 motor/coordinator/metrics/metrics_collector.py:_get_instances_metrics()
# 全部为无标签 Gauge，help = "Number of instances"
metrics:
  - name: motor_active_prefill_workers
    type: gauge
    help: Number of instances
    labels: []
    value:
      mode: pd_active_count
      role: prefill
  - name: motor_active_decode_workers
    type: gauge
    help: Number of instances
    labels: []
    value:
      mode: pd_active_count
      role: decode
  - name: motor_inactive_prefill_workers
    type: gauge
    help: Number of instances
    labels: []
    value:
      mode: pd_inactive_count
      role: prefill
  - name: motor_inactive_decode_workers
    type: gauge
    help: Number of instances
    labels: []
    value:
      mode: pd_inactive_count
      role: decode
