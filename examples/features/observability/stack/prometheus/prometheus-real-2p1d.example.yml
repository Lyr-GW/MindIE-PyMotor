# Prometheus configuration template for real 2P1D (2 Prefill + 1 Decode) deployment.
#
# Usage:
#   1. Copy to a local file (e.g. prometheus-real.local.yml) — do NOT commit
#      files with real IP/NodePort.
#   2. Replace all <placeholder> targets below with your cluster endpoints.
#   3. Point the stack at it via .env:
#        PROMETHEUS_CONFIG_FILE=./prometheus/prometheus-real.local.yml
#   4. Restart: docker compose up -d prometheus
#
# Alternatively, use file_sd_configs (see motor-engine-file-sd job below) and
# maintain targets in prometheus/targets/engine.json without editing this file.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  metric_name_validation_scheme: utf8
  external_labels:
    monitor: motor-observability
    cluster: "<cluster-name>"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: motor-coordinator
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<coordinator-node-ip>:<coordinator-obs-nodeport>"
        labels:
          motor_component: coordinator
          motor_metric_scope: cluster
          cluster: "<cluster-name>"
          source: real

  - job_name: motor-coordinator-instance
    metrics_path: /metrics?type=instance
    static_configs:
      - targets:
          - "<coordinator-node-ip>:<coordinator-obs-nodeport>"
        labels:
          motor_component: coordinator
          motor_metric_scope: instance
          cluster: "<cluster-name>"
          source: real

  - job_name: motor-coordinator-role-prefill
    metrics_path: /metrics?type=role&role=prefill
    static_configs:
      - targets:
          - "<coordinator-node-ip>:<coordinator-obs-nodeport>"
        labels:
          motor_component: coordinator
          motor_metric_scope: role
          role: prefill
          pd_role: prefill
          cluster: "<cluster-name>"
          source: real

  - job_name: motor-coordinator-role-decode
    metrics_path: /metrics?type=role&role=decode
    static_configs:
      - targets:
          - "<coordinator-node-ip>:<coordinator-obs-nodeport>"
        labels:
          motor_component: coordinator
          motor_metric_scope: role
          role: decode
          pd_role: decode
          cluster: "<cluster-name>"
          source: real

  - job_name: motor-engine
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - "<p0-metrics-host>:<p0-metrics-port>"
        labels:
          motor_component: engine
          role: prefill
          pd_role: prefill
          instance_id: "0"
          cluster: "<cluster-name>"
          source: real
      - targets:
          - "<p1-metrics-host>:<p1-metrics-port>"
        labels:
          motor_component: engine
          role: prefill
          pd_role: prefill
          instance_id: "1"
          cluster: "<cluster-name>"
          source: real
      - targets:
          - "<d0-metrics-host>:<d0-metrics-port>"
        labels:
          motor_component: engine
          role: decode
          pd_role: decode
          instance_id: "0"
          cluster: "<cluster-name>"
          source: real

  # Optional: load engine targets from a local JSON file (gitignored).
  # Create prometheus/targets/engine.json with:
  #   [{"targets":["<host>:<port>"],"labels":{"role":"prefill","pd_role":"prefill","instance_id":"0"}}]
  # - job_name: motor-engine-file-sd
  #   metrics_path: /metrics
  #   honor_labels: true
  #   file_sd_configs:
  #     - files:
  #         - /etc/prometheus/targets/engine.json
  #       refresh_interval: 30s
  #   relabel_configs:
  #     - target_label: motor_component
  #       replacement: engine
  #     - target_label: cluster
  #       replacement: "<cluster-name>"
  #     - target_label: source
  #       replacement: real

  - job_name: motor-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - "controller-metrics-proxy:9106"
        labels:
          motor_component: controller
          cluster: "<cluster-name>"
          source: real
