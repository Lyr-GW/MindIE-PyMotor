# Loki single-binary configuration for native (host) fallback.
# Data directory is relative to the working directory when loki starts.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ./generated/loki-data
  storage:
    filesystem:
      chunks_directory: ./generated/loki-data/chunks
      rules_directory: ./generated/loki-data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  chunk_idle_period: 1m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: ./generated/loki-data/index
    cache_location: ./generated/loki-data/index_cache
  filesystem:
    directory: ./generated/loki-data/chunks

limits_config:
  reject_old_samples: false
  retention_period: 72h
  allow_structured_metadata: true

compactor:
  working_directory: ./generated/loki-data/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
